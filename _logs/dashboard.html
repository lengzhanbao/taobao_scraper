<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>直播爬虫监控</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: "Microsoft YaHei", system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8b949e; font-size: 12px; margin-bottom: 14px; }
  .overview { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .ov-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 16px; min-width: 120px; }
  .ov-card .k { font-size: 11px; color: #8b949e; }
  .ov-card .v { font-size: 20px; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px; }
  .card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card .port { font-size: 16px; font-weight: 700; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot.green { background: #2ea043; box-shadow: 0 0 8px #2ea043; }
  .dot.yellow { background: #d29922; box-shadow: 0 0 8px #d29922; }
  .dot.red { background: #f85149; box-shadow: 0 0 8px #f85149; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #21262d; color: #8b949e; }
  .tag.ok { background: #12261a; color: #3fb950; }
  .tag.warn { background: #2d2413; color: #d29922; }
  .row { display: flex; justify-content: space-between; font-size: 12px; margin: 3px 0; color: #c9d1d9; }
  .row .lbl { color: #8b949e; }
  .pre { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 6px 8px; font-size: 10.5px; font-family: Consolas, monospace; color: #7ee787; white-space: pre-wrap; word-break: break-all; max-height: 140px; overflow-y: auto; margin-top: 8px; }
  .events { margin-top: 14px; background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px; }
  .events h2 { font-size: 14px; margin-bottom: 6px; }
  .off { opacity: 0.55; }
</style>
</head>
<body>
<h1>🎥 淘宝直播爬虫监控</h1>
<div class="sub">5 实例（9223-9227）· 每 5 秒自动刷新 · 数据来源: _logs</div>
<div class="overview">
  <div class="ov-card"><div class="k">实例存活</div><div class="v" id="ov-alive">-</div></div>
  <div class="ov-card"><div class="k">ffmpeg 在录</div><div class="v" id="ov-ffmpeg">-</div></div>
  <div class="ov-card"><div class="k">session 间数</div><div class="v" id="ov-sessions">-</div></div>
  <div class="ov-card"><div class="k">最后刷新</div><div class="v" id="ov-time" style="font-size:14px">-</div></div>
</div>
<div class="grid" id="grid"></div>
<div class="events">
  <h2>📋 监督事件日志</h2>
  <div class="pre" id="events">加载中...</div>
</div>
<script>
const PORTS = [9223, 9224, 9225, 9226, 9227];
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function fmtRate(kbs) {
  if (kbs == null) return "-";
  return kbs >= 1024 ? (kbs/1024).toFixed(1) + " MB/s" : kbs + " KB/s";
}
function render(d) {
  document.getElementById("ov-alive").textContent = d.instances.filter(i => i.alive).length + "/5";
  document.getElementById("ov-ffmpeg").textContent = d.ffmpeg;
  document.getElementById("ov-sessions").textContent = d.sessions;
  document.getElementById("ov-time").textContent = d.time;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const it of d.instances) {
    const alive = it.alive;
    const recording = it.rate_kbs && it.rate_kbs > 0;
    const stale = it.flv_age_min != null && it.flv_age_min > 15;
    let cls = "red", label = "进程挂了";
    if (alive && recording) { cls = "green"; label = "正在录制"; }
    else if (alive && it.flv_age_min == null) { cls = "yellow"; label = "等待/扫码中"; }
    else if (alive && stale) { cls = "red"; label = "FLV 停滞 " + it.flv_age_min + " 分钟"; }
    else if (alive) { cls = "yellow"; label = "进程在，无 FLV 增长"; }
    const card = document.createElement("div");
    card.className = "card" + (alive ? "" : " off");
    card.innerHTML = "<div class=\"head\">" +
      "<span class=\"dot " + cls + "\"></span>" +
      "<span class=\"port\">" + it.port + "</span>" +
      "<span class=\"tag " + cls + "\">" + label + "</span>" +
      "<span class=\"tag\">final " + it.finals + "</span></div>" +
      "<div class=\"row\"><span class=\"lbl\">房间</span><span>" + esc(it.room) + "</span></div>" +
      "<div class=\"row\"><span class=\"lbl\">段</span><span>" + esc(it.seg) + "</span></div>" +
      "<div class=\"row\"><span class=\"lbl\">FLV</span><span>" + it.flv_mb + " MB · 增速 " + fmtRate(it.rate_kbs) + " · " + (it.flv_age_min == null ? "-" : it.flv_age_min + " 分钟前写入") + "</span></div>" +
      "<div class=\"row\"><span class=\"lbl\">文件</span><span style=\"font-size:11px\">" + esc(it.flv_name) + "</span></div>" +
      "<div class=\"pre\">" + esc(it.log) + "</div>";
    grid.appendChild(card);
  }
  document.getElementById("events").textContent = d.events || "（无事件）";
}
async function tick() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    render(await r.json());
  } catch (e) {
    document.getElementById("grid").innerHTML = "<div class=\"card\">连接仪表盘服务失败: " + esc(e.message) + "</div>";
  }
}
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
