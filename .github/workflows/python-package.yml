# GitHub Actions - Python Package CI

name: Python Package

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test imports
      run: |
        python -c "from src.utils.config import STUDY_ROOT, FFMPEG; print('Config import OK')"
        python -c "import ast; ast.parse(open('src/crawler/taobao_crawler.py', encoding='utf-8').read()); print('Crawler syntax OK')"
        python -c "import ast; ast.parse(open('src/parser/parse_data.py', encoding='utf-8').read()); print('Parser syntax OK')"

    - name: Run tests
      run: |
        python -m pytest tests/ -q

    - name: Verify structure
      run: |
        python verify_structure.py
